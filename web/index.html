<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agente de Registro como Proveedor · Periferia</title>
    <style>
      :root {
        --bg: #0f1220;
        --panel: #171a2b;
        --panel-2: #1f2338;
        --txt: #e7e9f3;
        --muted: #9aa0b8;
        --accent: #6c7cff;
        --tool: #2a2f49;
        --ok: #37d399;
        --warn: #ffcf5c;
        --border: #2a2f49;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg); color: var(--txt); height: 100vh; display: flex; flex-direction: column;
      }
      header {
        padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
        display: flex; align-items: center; gap: 12px;
      }
      header h1 { font-size: 15px; margin: 0; font-weight: 600; }
      header .sub { font-size: 12px; color: var(--muted); }
      #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
      .msg { max-width: 760px; width: fit-content; padding: 12px 16px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; }
      .user { align-self: flex-end; background: var(--accent); color: white; }
      .assistant { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--border); }
      .tool { align-self: flex-start; max-width: 760px; width: 100%; background: var(--tool); border: 1px solid var(--border);
        border-radius: 10px; padding: 10px 12px; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
      .tool .name { color: var(--accent); font-weight: 600; }
      .tool .args { color: var(--muted); margin: 4px 0; }
      .tool pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; color: var(--txt); }
      .confirm { align-self: flex-start; max-width: 760px; width: 100%; border: 1px solid var(--warn);
        background: rgba(255,207,92,0.08); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-weight: 600; }
      .thinking { align-self: flex-start; color: var(--muted); font-style: italic; }
      footer { padding: 14px 20px; border-top: 1px solid var(--border); background: var(--panel); }
      form { display: flex; gap: 10px; max-width: 900px; margin: 0 auto; }
      input[type="text"] { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
        background: var(--panel-2); color: var(--txt); font-size: 14px; }
      button { padding: 12px 20px; border-radius: 10px; border: none; background: var(--accent); color: white;
        font-weight: 600; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .hint { max-width: 900px; margin: 8px auto 0; font-size: 11.5px; color: var(--muted); }
      .descargas { max-width: 900px; margin: 10px auto 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .descargas input { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); color: var(--txt); font-size: 13px; }
      .descargas button { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); color: var(--txt); font-size: 13px; cursor: pointer; }
      .descargas a { color: var(--accent); font-size: 12.5px; margin-left: 8px; text-decoration: none; }
      .descargas a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <header>
      <h1>Agente de Registro como Proveedor</h1>
      <span class="sub" id="estado">conectando…</span>
    </header>
    <div id="chat"></div>
    <footer>
      <form id="form">
        <input id="input" type="text" autocomplete="off"
          placeholder='Ej: Procesa el caso "ec-corp-andina" y no envíes nada hasta que yo confirme.' />
        <button id="enviar" type="submit">Enviar</button>
      </form>
      <div class="hint">Casos: co-industrias-delta, ec-corp-andina, hn-agroexport-sula, pa-logistica-istmo.</div>
      <div class="descargas">
        <input id="casoDesc" type="text" autocomplete="off" placeholder="caso (ej: ec-corp-andina)" />
        <button id="btnDesc" type="button">Descargar documentos</button>
        <span id="listaDesc"></span>
      </div>
    </footer>

    <script>
      const chat = document.getElementById("chat");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const enviar = document.getElementById("enviar");
      const estado = document.getElementById("estado");
      const sessionId = "web-" + Math.random().toString(36).slice(2, 10);

      fetch("/api/health").then(r => r.json()).then(h => {
        estado.textContent = h.ok ? `${h.provider} · ${h.model}` : "sin conexión";
      }).catch(() => estado.textContent = "sin conexión");

      // Descargar los documentos generados de un caso.
      const casoDesc = document.getElementById("casoDesc");
      const btnDesc = document.getElementById("btnDesc");
      const listaDesc = document.getElementById("listaDesc");
      btnDesc.addEventListener("click", async () => {
        const caso = casoDesc.value.trim();
        listaDesc.innerHTML = "";
        if (!caso) { listaDesc.textContent = "escribe un caso"; return; }
        try {
          const r = await fetch("/api/archivos?caso=" + encodeURIComponent(caso));
          const data = await r.json();
          if (!data.archivos || data.archivos.length === 0) {
            listaDesc.textContent = "sin documentos (¿ya procesaste ese caso en el chat?)";
            return;
          }
          data.archivos.forEach(f => {
            const a = document.createElement("a");
            a.href = "/api/descargar?f=" + encodeURIComponent(f);
            a.textContent = "⬇ " + f.split("/").pop();
            a.setAttribute("download", "");
            listaDesc.appendChild(a);
          });
        } catch (e) {
          listaDesc.textContent = "error al listar";
        }
      });

      function burbuja(clase, texto) {
        const d = document.createElement("div");
        d.className = "msg " + clase;
        d.textContent = texto;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
        return d;
      }

      function pintarToolCall(tc) {
        const d = document.createElement("div");
        d.className = "tool";
        let resumen = tc.resultado;
        try {
          const o = JSON.parse(tc.resultado);
          resumen = JSON.stringify(o, null, 2);
        } catch (e) {}
        d.innerHTML =
          '<span class="name">🔧 ' + tc.nombre + "</span>" +
          '<div class="args">args: ' + JSON.stringify(tc.argumentos) + "</div>" +
          "<pre>" + resumen.replace(/</g, "&lt;") + "</pre>";
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const texto = input.value.trim();
        if (!texto) return;
        burbuja("user", texto);
        input.value = "";
        enviar.disabled = true;
        const pensando = document.createElement("div");
        pensando.className = "thinking";
        pensando.textContent = "pensando…";
        chat.appendChild(pensando);
        chat.scrollTop = chat.scrollHeight;

        try {
          const r = await fetch("/api/chat", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ sessionId, message: texto }),
          });
          const data = await r.json();
          pensando.remove();

          if (data.error) {
            burbuja("assistant", "⚠️ " + data.error);
          } else {
            (data.toolCalls || []).forEach(pintarToolCall);
            if (data.needsConfirmation) {
              const c = document.createElement("div");
              c.className = "confirm";
              c.textContent = "⏸ El agente requiere tu confirmación explícita para continuar.";
              chat.appendChild(c);
            }
            burbuja("assistant", data.reply || "(sin respuesta)");
          }
        } catch (err) {
          pensando.remove();
          burbuja("assistant", "⚠️ Error de red: " + err.message);
        } finally {
          enviar.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
